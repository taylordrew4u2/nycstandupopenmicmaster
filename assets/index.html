<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#245da7">
  <meta name="description" content="Find NYC stand up comedy open mics by day, time, and borough. Browse the map, venue details, host links, and listing updates.">
  <link rel="canonical" href="https://nycopenmicmasterlist.com/">
  <meta property="og:title" content="NYC Open Mic Master List">
  <meta property="og:description" content="Find NYC comedy open mics by day, time, and borough. Map, host details, and visible updates.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nycopenmicmasterlist.com/">
  <title>NYC Open Mic Master List</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/map.js" defer></script>
  <script src="/assets/app.js" defer></script>
<script src="/assets/visitors.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to mics</a>
<header class="topbar"><div class="nav-inner">
  <div class="site-heading"><a href="/" class="wordmark" aria-label="NYC Open Mic Master List home"><img src="/assets/favicon.svg" alt="" width="20" height="20"></a><span id="last-sync" class="last-sync" role="status">LAST SYNC AT —</span></div>
  <div class="corner-controls"><details class="site-menu" id="site-menu"><summary>Menu</summary><nav aria-label="Site menu"><button data-action="calendar">Calendar</button><a href="/owner">Host sign in</a><a href="/submit">Submit a mic</a><a href="/about">About</a><a href="/shop">Shop</a></nav></details><span id="visit-count" class="visit-count" hidden></span></div>
</div></header>
<div id="preview-banner" class="preview-banner" hidden></div>
<div class="status-strip" hidden><span id="directory-dot"></span><span id="directory-status"></span></div>
<main id="main" tabindex="-1">
<section id="view-directory">
  <section id="listings" class="directory-section" aria-label="Open-mic listings">
    <div class="directory-controls" role="search">
      <input id="search" type="search" placeholder="Search mics or venues" aria-label="Search mics or venues" autocomplete="off">
      <select id="day-filter" aria-label="Day or date"></select>
      <select id="borough-filter" aria-label="Borough"><option value="all">All boroughs</option><option>Manhattan</option><option>Brooklyn</option><option>Queens</option><option>Bronx</option><option>Staten Island</option></select>
      <button id="more-filters" class="compact-button" data-action="filters">Filters</button>
    </div>
    <div class="directory-layout">
      <section id="map-panel" class="map-panel" aria-label="NYC open mic map">
        <div id="nyc-map" class="city-map" role="region" aria-label="Interactive NYC map. Drag to pan, pinch or double tap to zoom, or use the zoom buttons">
          <div class="tile-plane"></div><div class="pin-plane"></div>
          <div class="map-controls"><button type="button" data-map="in" aria-label="Zoom in">+</button><button type="button" data-map="out" aria-label="Zoom out">−</button><button type="button" class="map-reset" data-action="map-reset" aria-label="Show all NYC" title="Show all NYC">NYC</button></div>
          <span class="map-offline" hidden>Map unavailable. Select a mic for its address.</span>
          <div class="map-attribution">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>
          <div class="map-popup" hidden></div>
        </div>
      </section>
      <section class="results" aria-label="Matching mics">
        <div class="results-toolbar"><p id="result-count" role="status" aria-live="polite"></p><button id="map-toggle" class="compact-button" data-action="map-toggle" aria-controls="map-panel" aria-expanded="true">Hide map</button><div class="list-pagination" aria-label="Listing pages"><button class="compact-button" data-action="previous-page" aria-label="Previous page">‹</button><span id="page-count" aria-live="polite"></span><button class="compact-button" data-action="next-page" aria-label="Next page">›</button></div></div>
        <div id="cards" class="mic-list"></div>
      </section>
    </div>
  </section>
</section>
<section id="view-sources" class="wrap admin-section" hidden></section>
</main>
<dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
