name: Backend checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          # Disposable CI service only; no production data or credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      - name: Directory date and map logic
        run: |
          node tests/calendar_logic.cjs
          node tests/past_mic_logic.cjs
          node tests/map_viewport.cjs
          node tests/map_individual_pins.cjs
      - name: Install browser for directory checks
        run: python -m playwright install --with-deps chromium
      - name: Directory layout, scrolling and map interaction
        run: |
          python scripts/build_preview.py
          python tests/directory_layout_checks.py
          python tests/browser_directory_scrolling.py
          python tests/browser_text_size.py
